apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-event-registration
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-event-registration
  template:
    metadata:
      labels:
        app: student-event-registration
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: student-event-registration
          image: niharikarao15/student-event-registration:v2
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: student-event-registration-service
spec:
  type: NodePort
  selector:
    app: student-event-registration
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30011